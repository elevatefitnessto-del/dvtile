name = "dvtile"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Appointment form email (Cloudflare Email Routing). The destination address must be
# verified under Email Routing for dvtile.ca before this works.
[[send_email]]
name = "APPOINTMENTS"
destination_address = "REPLACE_WITH_SHOWROOM_INBOX@example.com"

[vars]
APPOINTMENTS_TO = "REPLACE_WITH_SHOWROOM_INBOX@example.com"
