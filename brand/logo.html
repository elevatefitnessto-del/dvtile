.board{display:grid;grid-template-columns:1fr 1fr;gap:0}

.dark{background:#14201d}
.lock{display:flex;align-items:center;gap:34px}
.lock svg{width:150px;height:150px}
.words{display:grid;justify-items:start}
.wm{font-weight:600;font-size:92px;letter-spacing:.2em;line-height:.9;color:#22403a;margin-right:-.2em}
.sc{font-family:"Pinyon Script",cursive;font-size:64px;line-height:1;color:#8c6b44;margin:6px 0 0 4px}
.stack{display:grid;justify-items:center}
.stack svg{width:170px;height:170px;margin-bottom:28px}
.stack .wm{font-size:84px}
.stack .sc{margin:4px 0 0}
.dark .wm{color:#f2f2ef}.dark .sc{color:#c9a274}
</style></head><body>
